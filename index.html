rder-collapse:collapse; font-size:11.5px; table-layout:fixed;\n  }\n  .schedule-grid th, .schedule-grid td{\n    border:1px solid #D8D2C4; padding:7px 6px; text-align:center; vertical-align:top;\n  }\n  .schedule-grid thead th{\n    background:var(--ink, #141A3D); color:#fff; font-family:var(--font-display); font-weight:800; font-size:11.5px;\n  }\n  .schedule-grid td.day-col{\n    font-family:var(--font-display); font-weight:800; font-size:12px;\n    white-space:nowrap; width:70px;\n  }\n  .schedule-grid td.day-col .day-c{ display:block; font-size:10px; font-weight:600; opacity:0.75; margin-top:2px; }\n  .schedule-grid .slot-entry{ margin-bottom:4px; line-height:1.4; }\n  .schedule-grid .slot-entry:last-child{ margin-bottom:0; }\n  .schedule-grid .slot-time{ font-family:var(--font-mono, monospace); font-weight:700; display:block; font-size:10.5px; }\n  .schedule-grid .slot-name{ font-weight:700; display:block; }\n  .schedule-grid .slot-grade{ font-size:9.5px; opacity:0.8; }\n  .unscheduled-note{\n    margin-top:12px; font-size:11.5px; color:var(--ink-soft); line-height:1.8;\n    border-top:1px dashed var(--surface-border); padding-top:8px;\n  }\n  .badge{\n    display:inline-block;\n    padding:2px 9px;\n    border-radius:20px;\n    font-size:10.5px;\n    font-weight:700;\n    font-family:var(--font-mono);\n    direction:ltr;\n  }\n  .badge.g10{background:var(--g10-soft); color:var(--g10-deep);}\n  .badge.g11{background:var(--g11-soft); color:var(--g11-deep);}\n  .badge.g12{background:var(--g12-soft); color:var(--g12-deep);}\n  #toast{\n    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);\n    background:var(--ink); color:var(--surface);\n    padding:11px 20px; border-radius:30px;\n    font-size:13px; font-weight:600;\n    display:none; z-index:100;\n  }\n  @media print{\n    body *{visibility:hidden;}\n    #printArea, #printArea *{visibility:visible;}\n    #printArea{position:absolute; top:0; right:0; left:0; width:100%;}\n    .overlay{position:s =\"content\" id=\"mainContent\">\n    <div id=\"todayWrap\"><\/div>\n    <div class=\"sec-h\">\n      <div class=\"ttl\"><h3 id=\"listTitle\"><\/h3><span class=\"cnt\" id=\"listCount\"><\/span><\/div>\n    <\/div>\n    <label class=\"search\" id=\"searchRow\"><svg class=\"ic\"><use href=\"#i-search\"/><\/svg><input id=\"searchInput\" type=\"search\" placeholder=\"ابحث بالاسم أو العنوان…\" autocomplete=\"off\"><\/label>\n    <div id=\"listWrap\"><\/div>\n  <\/main>\n  <div class=\"fab-wrap\"><button class=\"fab\" id=\"addBtn\" aria-label=\"إضافة طالب\"><svg class=\"ic\"><use href=\"#i-plus\"/><\/svg><\/button><\/div>\n<\/div>\n\n<\!-- add / edit -->\n<div class=\"overlay\" id=\"formOverlay\"><div class=\"sheet\">\n  <h2 id=\"formTitle\">إضافة طالب<\/h2>\n  <div class=\"field\"><label>اسم الطالب<\/label><input type=\"text\" id=\"f-name\" placeholder=\"مثال: محمد أحمد\" autocomplete=\"off\"><\/div>\n  <div class=\"field\"><label>العنوان<\/label><input type=\"text\" id=\"f-address\" placeholder=\"مثال: حولي، شارع تونس\" autocomplete=\"off\"><\/div>\n  <div class=\"field\"><label>يوم الموعد الأسبوعي<\/label>\n    <select id=\"f-day\"><option value=\"السبت\">السبت<\/option><option value=\"الأحد\">الأحد<\/option><option value=\"الاثنين\">الاثنين<\/option><option value=\"الثلاثاء\">الثلاثاء<\/option><option value=\"الأربعاء\">الأربعاء<\/option><option value=\"الخميس\">الخميس<\/option><option value=\"الجمعة\">الجمعة<\/option><\/select><\/div>\n  <div class=\"field\"><label>وقت الموعد<\/label><input type=\"time\" id=\"f-time\"><\/div>\n  <div class=\"field\"><label>رابط الموقع (اختياري)<\/label><input type=\"url\" id=\"f-location\" placeholder=\"الصق رابط الموقع من خرائط جوجل\" autocomplete=\"off\"><\/div>\n  <div class=\"field\"><label>رقم ولي الأمر — واتساب (اختياري)<\/label><div class=\"inrow\"><input type=\"tel\" inputmode=\"tel\" class=\"num-in\" id=\"f-phone\" placeholder=\"مثال: 55512345\" autocomplete=\"off\"><button type=\"button\" class=\"pick-btn\" id=\"f-pick\" aria-label=\"اختيار من جهات الاتصال\"><svg class=\"ic\"><use href=\"#i-contact\"/><\/svg><\/button><button type=\"button\" class=\"pick-btn alt\" id=\"f-paste\" aria-label=\"لصق رقم منسوخ\"><svg class=\"ic\"><use href=\"#i-paste\"/><\/svg><\/button><\/div><div class=\"hint\" id=\"f-picked\"><\/div><\/div>\n  <div class=\"field\"><label>قيمة اشتراك الطالب (د.ك) — تظهر في الاشتراكات<\/label><input type=\"text\" inputmode=\"decimal\" class=\"num-in\" id=\"f-fee\" placeholder=\"0\" autocomplete=\"off\"><\/div>\n  <div class=\"sheet-actions\"><button class=\"btn btn-ghost\" id=\"formCancel\">إلغاء<\/button><button class=\"btn btn-primary\" id=\"formSave\" style=\"flex:2\">حفظ<\/button><\/div>\n<\/div><\/div>\n\n<\!-- weekly table -->\n<div class=\"overlay\" id=\"tableModal\"><div class=\"sheet\">\n  <h2>الجدول الأسبوعي المجمع<\/h2>\n  <div id=\"printArea\" style=\"overflow-x:auto;\"><div id=\"combinedTable\"><\/div><\/div>\n  <div class=\"sheet-actions\">\n    <button class=\"btn btn-ghost\" id=\"tableClose\">إغلاق<\/button>\n    <button class=\"btn btn-ghost\" id=\"tableWordBtn\"><svg class=\"ic\"><use href=\"#i-file\"/><\/svg> Word<\/button>\n    <button class=\"btn btn-primary\" id=\"tablePrint\"><svg class=\"ic\"><use href=\"#i-printer\"/><\/svg> طباعة / PDF<\/button>\n  <\/div>\n<\/div><\/div>\n\n<\!-- addresses -->\n<div class=\"overlay\" id=\"addressModal\"><div class=\"sheet\">\n  <h2>تجميع الطلاب حسب العنوان<\/h2>\n  <div id=\"addressGroups\"><\/div>\n  <div class=\"sheet-actions\"><button class=\"btn btn-ghost\" id=\"addressClose\">إغلاق<\/button><\/div>\n<\/div><\/div>\n\n<\!-- backup -->\n<div class=\"overlay\" id=\"backupModal\"><div class=\"sheet\">\n  <h2>النسخة الاحتياطية<\/h2>\n  <p class=\"sheet-sub\">احفظ نسخة من بيانات كل الطلاب في ملف، واحتفظ بها في مكان آمن (Google Drive أو WhatsApp)، ثم استرجعها وقت الحاجة على نفس الجهاز أو جهاز آخر.<\/p>\n  <button class=\"opt\" id=\"backupExportBtn\"><span class=\"oi\"><svg class=\"ic\"><use href=\"#i-download\"/><\/svg><\/span><span><b>تنزيل نسخة احتياطية<\/b><small>ملف JSON فيه كل الطلاب<\/small><\/span><\/button>\n  <div class=\"opt\"><span class=\"oi\"><svg class=\"ic\"><use href=\"#i-upload\"/><\/svg><\/span><span><b>استرجاع من ملف<\/b><small>اختر ملف نسخة سابقة<\/small><\/span><input type=\"file\" id=\"backupImportInput\" accept=\"application/json,.json\"><\/div>\n  <p class=\"warn\">⚠ الاسترجاع يستبدل كل البيانات الحالية بمحتوى الملف المستورد.<\/p>\n  <div class=\"sheet-actions\"><button class=\"btn btn-ghost\" id=\"backupClose\">إغلاق<\/button><\/div>\n<\/div><\/div>\n\n<div id=\"toast\"><\/div>\n\n<\script>\n(function(){\n  var GRADES = {\n    g10:{name:\"الصف العاشر\", short:\"Grade 10\", color:\"var(--g10)\", deep:\"#0A5A62\"},\n    g11:{name:\"الصف الحادي عشر\", short:\"Grade 11\", color:\"var(--g11)\", deep:\"#8E5A0C\"},\n    g12:{name:\"الصف الثاني عشر\", short:\"Grade 12\", color:\"var(--g12)\", deep:\"#523C7C\"}\n  };\n  /* ===== ربط طلابي بالاشتراكات (نفس الكود في الصفحتين) ===== */\n  var LK = (function(){\n    var S_KEY = \"subscriber-students\", C_KEY = \"coursaty_data_v1\";\n    var GN = { g10:\"العاشر\", g11:\"الحادي عشر\", g12:\"الثاني عشر\" };\n    function rd(k){ try{ var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }\n    function wr(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }\n    function wd(t){\n      var ar = \"٠١٢٣٤٥٦٧٨٩\", fa = \"۰۱۲۳۴۵۶۷۸۹\";\n      return String(t == null ? \"\" : t).replace(/[٠-٩۰-۹]/g, function(c){ var i = ar.indexOf(c); if(i < 0) i = fa.indexOf(c); return i < 0 ? c : String(i); });\n    }\n    function pk(p){ var d = wd(p).replace(/[^0-9]/g, \"\"); if(d.indexOf(\"00\") === 0) d = d.slice(2); if(d.length === 8) d = \"965\" + d; return d.length >= 8 ? d : \"\"; }\n    function nn(n){ return String(n || \"\").replace(/\\s+/g, \" \").trim(); }\n    function nm(x){ x = Number(x); return (isFinite(x) && x > 0) ? x : 0; }\n    functio s=\"slot-name\">' + escapeHtml(e.name) + '<\/span>' +\n        '<span class=\"slot-grade\">' + escapeHtml(GRADES[e.grade].short) + '<\/span>' +\n        '<\/span>';\n    }).join(\"\");\n  }\n\n  function renderScheduleGridHtml(grid){\n    var head = '<tr><th>اليوم<\/th>';\n    for(var i=1;i<=MAX_SLOTS;i++){ head += '<th>الموعد ' + i + '<\/th>'; }\n    head += '<\/tr>';\n\n    var body = \"\";\n    grid.rows.forEach(function(r, idx){\n      var bg = ROW_COLORS[idx % 2];\n      body += '<tr style=\"background:' + bg + ';\">' +\n        '<td class=\"day-col\">' + escapeHtml(r.day) + '<span class=\"day-c\">' + r.count + ' موعد<\/span><\/td>';\n      r.slots.forEach(function(entries){\n        body += '<td>' + slotCellHtml(entries) + '<\/td>';\n      });\n      body += '<\/tr>';\n    });\n\n    var html = '<table class=\"schedule-grid\"><thead>' + head + '<\/thead><tbody>' + body + '<\/tbody><\/table>';\n\n    if(grid.unscheduled.length > 0){\n      html += '<div class=\"unscheduled-note\"><b>بدون يوم محدد (' + grid.unscheduled.length + '):<\/b> ' +\n        grid.unscheduled.map(function(e){ return escapeHtml(e.name) + ' (' + escapeHtml(GRADES[e.grade].short) + ')'; }).join('، ') +\n        '<\/div>';\n    }\n    return html;\n  }\n\n  document.getElementById(\"combinedBtn\").addEventListener(\"click\", function(){\n    var grid = buildDayGrid();\n    var container = document.getElementById(\"combinedTable\");\n    if(grid.total === 0){\n      container.innerHTML = '<div style=\"padding:20px 0;color:var(--ink-soft);text-align:center;\">لا يوجد طلاب مسجلون بعد<\/div>';\n    } else {\n      container.innerHTML = renderScheduleGridHtml(grid);\n    }\n    showOv(tableModal);\n  });\n  document.getElementById(\"tableClose\").addEventListener(\"click\", function(){ hideOv(tableModal); });\n  tableModal.addEventListener(\"click\", function(e){ if(e.target === tableModal) hideOv(tableModal); });\n  document.getElementById(\"tablePrint\").addEventListener(\"click\", function(){ w g.g11 || [];\n      state.students.g12 = incoming.g12 || [];\n      await saveStudents();\n      renderAll();\n      hideOv(backupModal);\n      showToast(\"تم استرجاع البيانات بنجاح\");\n    };\n    reader.readAsText(file);\n  });\n\n  // ---------- export ----------\n  document.getElementById(\"exportBtn\").addEventListener(\"click\", function(){\n    try{\n      var headers = [\"الاسم\",\"العنوان\",\"يوم الموعد\",\"وقت الموعد\",\"رابط الموقع\"];\n      var wb = XLSX.utils.book_new();\n\n      Object.keys(GRADES).forEach(function(g){\n        var rows = [headers];\n        state.students[g].forEach(function(s){\n          rows.push([s.name || \"\", s.address || \"\", s.day || \"\", formatTime12(s.time), s.location || \"\"]);\n        });\n        var ws = XLSX.utils.aoa_to_sheet(rows);\n        ws[\"!cols\"] = [{wch:22},{wch:28},{wch:14},{wch:10},{wch:32}];\n        XLSX.utils.book_append_sheet(wb, ws, GRADES[g].short);\n      });\n\n      // sheet mirroring the printed weekly schedule grid: rows = days, columns = appointment slots\n      var grid = buildDayGrid();\n      var gridHeader = [\"اليوم\", \"عدد المواعيد\"];\n      for(var i=1;i<=MAX_SLOTS;i++){ gridHeader.push(\"الموعد \" + i); }\n      var gridRows = [gridHeader];\n\n      grid.rows.forEach(function(r){\n        var row = [r.day, r.count];\n        r.slots.forEach(function(entries){\n          var cellText = (entries || []).map(function(e){\n            return (e.time ? formatTime12(e.time) + \" - \" : \"\") + e.name + \" (\" + GRADES[e.grade].short + \")\";\n          }).join(\"\\n\");\n          row.push(cellText);\n        });\n        gridRows.push(row);\n      });\n\n      if(grid.unscheduled.length > 0){\n        gridRows.push([]);\n        gridRows.push([\"بدون يوم محدد\", grid.unscheduled.length]);\n        grid.unscheduled.forEach(function(e){\n          gridRows.push([e.name + \" (\" + GRADES[e.grade].short + \")\"]);\n        });\n      }\n\n      var wsGrid = XLSX.utils.aoa_to_sheet(gridRo , 800, py + 62);\n      // footer\n      c.textAlign = \"center\"; c.fillStyle = \"#64748B\"; c.font = font(500, 28); c.fillText(\"شكراً لكم — تم استلام المبلغ بنجاح\", 450, 230 + cardH + 78);\n      return new Promise(function(res){ cv.toBlob(res, \"image/png\"); });\n    });\n  }\n  function dlBlob(blob, name){\n    var url = URL.createObjectURL(blob), a = document.createElement(\"a\");\n    a.href = url; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);\n  }\n  function openReceipt(s, pm){\n    buildReceipt(s, pm).then(function(blob){\n      if(!blob){ toast(\"تعذر إنشاء الإيصال\"); return; }\n      if(rc.url) URL.revokeObjectURL(rc.url);\n      rc.blob = blob; rc.url = URL.createObjectURL(blob);\n      rc.name = \"ايصال-\" + s.name.replace(/\\s+/g, \"-\") + \"-\" + (pm.date || todayISO()) + \".png\";\n      $(\"receipt-img\").src = rc.url; openOv(\"overlay-receipt\");\n    }).catch(function(){ toast(\"تعذر إنشاء الإيصال\"); });\n  }\n  $(\"receipt-close-btn\").addEventListener(\"click\", closeOv);\n  $(\"receipt-save-btn\").addEventListener(\"click\", function(){ if(rc.blob){ dlBlob(rc.blob, rc.name); toast(\"تم حفظ صورة الإيصال\"); } });\n  $(\"receipt-share-btn\").addEventListener(\"click\", function(){\n    if(!rc.blob) return;\n    var file = null; try{ file = new File([rc.blob], rc.name, { type:\"image/png\" }); }catch(e){}\n    if(file && navigator.canShare && navigator.canShare({ files:[file] })){ navigator.share({ files:[file], title:\"إيصال دفعة\" }).catch(function(){}); }\n    else { dlBlob(rc.blob, rc.name); toast(\"تم حفظ الصورة — شاركها من المعرض\"); }\n  });\n\n  function refreshFromStorage(){\n    try{ LK.reconcile(); }catch(e){}\n    state.data = load();\n    var onDetail = $(\"screen-detail\").style.display === \"block\";\n    if(state.currentId && !find(state.currentId)){ state.currentId = null; if(onDetail) showScreen(\"dashboard\"); onDetai   var PIN_KEY = "main-pin-v1";
  var ALL_KEYS = [PIN_KEY, "subscriber-pin", "subscriber-students", "coursaty_data_v1", "coursaty_pin_v1", "coursaty_sort_v2"];
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
  function west(s){
    var ar = "٠١٢٣٤٥٦٧٨٩", fa = "۰۱۲۳۴۵۶۷۸۹";
    return String(s).replace(/[٠-٩۰-۹]/g, function(c){ var i = ar.indexOf(c); if(i === -1) i = fa.indexOf(c); return i === -1 ? c : String(i); });
  }
  var input = document.getElementById("pinInput"), sub = document.getElementById("pinSub"), msg = document.getElementById("pinMsg");
  var mode, firstPin = "";
  function initPin(){
    var pin = lsGet(PIN_KEY);
    if(!pin){
      var legacy = lsGet("subscriber-pin") || lsGet("coursaty_pin_v1");
      if(legacy && /^[0-9]{4}$/.test(legacy)){ pin = legacy; lsSet(PIN_KEY, pin); }
    }
    if(pin){ mode = "enter"; sub.textContent = "أدخل الرمز السري للدخول"; }
    else { mode = "setup"; sub.textContent = "أول مرة؟ اختر رمزاً سرياً من 4 أرقام"; }
    input.value = ""; setTimeout(function(){ input.focus(); }, 250);
  }
  input.addEventListener("input", function(){
    var v = west(input.value).replace(/[^0-9]/g, ""); input.value = v;
    if(v.length === 4) setTimeout(function(){ handlePin(v); }, 150);
  });
  function handlePin(v){
    msg.textContent = "";
    if(mode === "setup"){ firstPin = v; input.value = ""; mode = "confirm"; sub.textContent = "أعد إدخال الرمز للتأكيد"; input.focus(); return; }
    if(mode === "confirm"){
      if(v === firstPin){ lsSet(PIN_KEY, v); openMain(); }
      else { msg.textContent = "الرمزان غير متطابقين، حاول مجدداً"; input.value = ""; mode = "setup"; sub.textContent = "اختر رمزاً سرياً من 4 أرقام"; input.focus(); }
      return;
    }
    if(v === lsGet(PIN_KEY)) openMain();
    else { msg.textContent = "رمز غير صحيح، حاول مجدداً"; input.value = ""; input.focus(); }
  }
  document.getElementById("pinReset").addEventListener("click", function(){
    if(!confirm("سيتم حذف الرمز السري وجميع بيانات اشتركاتي (طلابي وكورساتي) نهائياً من هذا الجهاز. هل أنت متأكد؟")) return;
    if(!confirm("تأكيد أخير: لا يمكن التراجع عن هذا الحذف. المتابعة؟")) return;
    ALL_KEYS.forEach(lsDel); initPin(); msg.textContent = "تم مسح البيانات";
  });
  var loaded = {}, curTab = null;
  function showTab(name){
    curTab = name;
    ["students","courses"].forEach(function(n){
      var fr = document.getElementById("fr-" + n), on = (n === name);
      fr.style.display = on ? "block" : "none";
      document.getElementById("tab-" + n).className = on ? "active" : "";
      if(on && !loaded[n]){ loaded[n] = true; fr.srcdoc = APPS[n]; }
      else if(loaded[n]){ try{ fr.contentWindow.postMessage({ type:"visible", v:on }, "*"); }catch(e){} }
    });
  }
  document.getElementById("tab-students").addEventListener("click", function(){ showTab("students"); });
  document.getElementById("tab-courses").addEventListener("click", function(){ showTab("courses"); });
  /* ----- class reminders coming from طلابي ----- */
  var alertT;
  window.addEventListener("message", function(e){
    if(!e.data || e.data.type !== "alert") return;
    var bar = document.getElementById("alertBar");
    bar.textContent = "⏰ " + e.data.text; bar.style.display = "block";
    clearTimeout(alertT); alertT = setTimeout(function(){ bar.style.display = "none"; }, 10000);
    if(navigator.vibrate){ try{ navigator.vibrate([250, 120, 250]); }catch(_){} }
  });
  document.getElementById("alertBar").addEventListener("click", function(){ this.style.display = "none"; showTab("students"); });

  /* ----- contact picker: needs a top-level page, so the shell opens it and hands the result to the apps ----- */
  function deliver(src, payload){
    var seen = [];
    [src, document.getElementById("fr-students").contentWindow, document.getElementById("fr-courses").contentWindow].forEach(function(w){
      if(!w || seen.indexOf(w) >= 0) return; seen.push(w);
      try{ w.postMessage(payload, "*"); }catch(e){}
    });
    try{ localStorage.setItem("__contact_pick", JSON.stringify({ t:Date.now(), p:payload })); }catch(e){}
  }
  function pickContact(src){
    if(!(navigator.contacts && navigator.contacts.select)){
      toast("جهات الاتصال غير مدعومة هنا — اكتب الرقم يدوياً (افتح البرنامج من رابط https في كروم أندرويد)");
      deliver(src, { type:"contact-result", ok:false, reason:"unsupported" }); return;
    }
    var p;
    try{ p = navigator.contacts.select(["name", "tel"], { multiple:false }); }
    catch(err){ toast("تعذر فتح جهات الاتصال: " + (err && err.name || err)); deliver(src, { type:"contact-result", ok:false, reason:"error" }); return; }
    p.then(function(res){
      if(!res || !res.length){ deliver(src, { type:"contact-result", ok:false, reason:"cancelled" }); return; }
      var c = res[0], tels = [];
      (c.tel || []).forEach(function(t){ tels.push(String(t)); });
      var name = (c.name && c.name[0]) ? String(c.name[0]) : "";
      if(!tels.length){ toast("جهة الاتصال المختارة ليس لها رقم هاتف"); deliver(src, { type:"contact-result", ok:false, reason:"notel" }); return; }
      toast("وصل الرقم: " + (name ? name + " — " : "") + tels[0]);
      deliver(src, { type:"contact-result", ok:true, tels:tels, name:name });
    }).catch(function(err){
      toast("تعذر قراءة جهة الاتصال: " + (err && err.name || err));
      deliver(src, { type:"contact-result", ok:false, reason:"error" });
    });
  }

  /* ----- phone back button: steps back inside the current tab; at the very end asks before exiting ----- */
  var guardOn = false, exiting = false, exitOpen = false;
  function ensureGuard(){
    if(guardOn || exiting) return;
    try{ history.replaceState({ root:1 }, ""); history.pushState({ guard:1 }, ""); guardOn = true; }catch(e){}
  }
  ["pointerup", "touchend", "click", "keydown"].forEach(function(ev){ document.addEventListener(ev, ensureGuard, true); });
  function toast(m){ var t = document.getElementById("shellToast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._t); t._t = setTimeout(function(){ t.style.display = "none"; }, 3500); }
  function showExit(show){ exitOpen = show; document.getElementById("exitModal").style.display = show ? "flex" : "none"; if(show) ensureGuard(); }
  function rootBack(){
    if(exitOpen){ showExit(false); return; }
    if(document.getElementById("main").style.display !== "flex"){ showExit(true); return; }
    // fallback: the visible tab may still have something open that has no history entry
    var fr = document.getElementById("fr-" + curTab), settled = false, tm;
    function finish(handled){
      if(settled) return; settled = true; clearTimeout(tm); window.removeEventListener("message", onMsg);
      if(!handled) showExit(true);
    }
    function onMsg(ev){ if(ev.source === fr.contentWindow && ev.data && ev.data.type === "back-result") finish(!!ev.data.handled); }
    window.addEventListener("message", onMsg);
    tm = setTimeout(function(){ finish(false); }, 500);
    try{ fr.contentWindow.postMessage({ type:"back" }, "*"); }catch(e){ finish(false); }
  }
  window.addEventListener("popstate", function(){
    if(exiting) return;
    var st = history.state;
    if(guardOn && st && st.root){ guardOn = false; rootBack(); }
  });
  window.addEventListener("message", function(e){
    var d = e.data; if(!d) return;
    if(d.type === "gesture"){ ensureGuard(); }
    else if(d.type === "hidden-pop"){ try{ history.back(); }catch(_){} }
    else if(d.type === "pick-contact"){ pickContact(e.source); }
  });
  document.getElementById("exitStay").addEventListener("click", function(){ showExit(false); ensureGuard(); });
  function finishExit(){
    try{ window.close(); }catch(e){}
    setTimeout(function(){ try{ history.back(); }catch(e){} }, 150);
    setTimeout(function(){
      document.getElementById("exitModal").style.display = "none";
      document.getElementById("closedScreen").style.display = "flex";
    }, 800);
  }
  document.getElementById("exitGo").addEventListener("click", function(){
    exiting = true;
    var left = 1;
    document.getElementById("exitTitle").textContent = "جارِ الخروج…";
    document.getElementById("exitActs").style.display = "none";
    function tick(){
      document.getElementById("exitText").textContent = "سيُغلق البرنامج بعد " + (left >= 2 ? "ثانيتين" : (left === 1 ? "ثانية واحدة" : "لحظات"));
      if(left <= 0){ finishExit(); return; }
      left--; setTimeout(tick, 1000);
    }
    document.getElementById("exitText").textContent = "";
    tick();
  });
  document.getElementById("reopenBtn").addEventListener("click", function(){ location.reload(); });
  function openMain(){
    document.getElementById("lock").style.display = "none";
    document.getElementById("main").style.display = "flex";
    var wanted = ""; try{ wanted = new URLSearchParams(location.search).get("tab") || ""; }catch(e){}
    showTab(wanted === "courses" ? "courses" : "students");
  }
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
  initPin();
})();
